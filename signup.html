<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Mobility</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;

    background:#fff;

    font-size:22px;

    background:white;

</head>

<body>

<header class="header">
<div class="header-inner">

<a href="index.html" class="logo">
Mobility<span>.</span>
</a>

<a href="index.html" class="back">
← Back to Website
</a>

</div>
</header>

<div class="container">

<div class="card">

<h1>Create Your Account</h1>

<p class="subtitle">
Create an account to apply for motorcycle hire-purchase opportunities.
</p>

<div id="message" class="message error"></div>

<form id="signupForm">

<label>Account Type</label>

<div class="account-types">

<label class="account-type active" id="hireType">
<input type="radio" name="accountType" value="hire-purchase" checked>
<span style="font-size:28px">🏍️</span>
<strong>Hire-Purchase</strong>
<small>I want to acquire a motorcycle</small>
</label>

<label class="account-type" id="investorType">
<input type="radio" name="accountType" value="investor">
<span style="font-size:28px">💰</span>
<strong>Investor</strong>
<small>I want to invest in the business</small>
</label>

</div>

<label>First Name *</label>
<input type="text" id="firstName" required>

<label>Last Name *</label>
<input type="text" id="lastName" required>

<label>Email Address *</label>
<input type="email" id="email" required>

<label>Phone Number *</label>
<input type="tel" id="phone" required>

<label>Residential Address</label>
<input type="text" id="address">

<label>Employer / Business Name *</label>
<input type="text" id="business" value="Mobility & Hire-Purchase Services" required>

<label>Create Password *</label>
<input type="password" id="password" minlength="8" required>

<label>Confirm Password *</label>
<input type="password" id="confirmPassword" minlength="8" required>

<label style="font-weight:400;margin-bottom:20px">
<input type="checkbox" id="terms" required style="width:auto;margin-right:8px">
I agree to the Terms & Conditions and confirm that my information is accurate.
</label>

<button type="submit">
Create Account
</button>

</form>

<div class="login">
Already have an account?
<a href="login.html">Sign In</a>
</div>

</div>

</div>

<script>

const hireType = document.getElementById("hireType");
const investorType = document.getElementById("investorType");

hireType.addEventListener("click",()=>{
    hireType.classList.add("active");
    investorType.classList.remove("active");
});

investorType.addEventListener("click",()=>{
    investorType.classList.add("active");
    hireType.classList.remove("active");
});

document.getElementById("signupForm").addEventListener("submit",function(e){

    e.preventDefault();

    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const business = document.getElementById("business").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("message");

    if(password !== confirmPassword){

        message.textContent = "Passwords do not match.";
        message.style.display = "block";
        return;

    }

    if(password.length < 8){

        message.textContent = "Password must contain at least 8 characters.";
        message.style.display = "block";
        return;

    }

    const users = JSON.parse(localStorage.getItem("mhp_users") || "[]");

    const existingUser = users.find(user => user.email === email);

    if(existingUser){

        message.textContent = "An account with this email already exists.";
        message.style.display = "block";
        return;

    }

    const accountType = document.querySelector(
        'input[name="accountType"]:checked'
    ).value;

    const user = {

        id: "USR-" + Date.now(),

        firstName,
        lastName,
        fullName: firstName + " " + lastName,

        email,
        phone,
        address,
        business,

        accountType,

        password,

        createdAt: new Date().toISOString()

    };

    users.push(user);

    localStorage.setItem("mhp_users",JSON.stringify(users));

    localStorage.setItem("mhp_current_user",JSON.stringify(user));

    if(accountType === "investor"){

        window.location.href = "investor-application.html";

    }else{

        window.location.href = "application.html";

    }

});

</script>

</body>
</html>
