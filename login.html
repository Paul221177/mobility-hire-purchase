<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | Mobility Hire Purchase</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #172033;
}

.header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 20px 25px;
}

.header a {
    text-decoration: none;
    color: #111827;
    font-size: 21px;
    font-weight: 800;
}

.header span {
    color: #d97706;
}

.container {
    max-width: 500px;
    margin: 70px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 18px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 30px rgba(0,0,0,.05);
}

h1 {
    margin-bottom: 10px;
}

.intro {
    color: #667085;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: 700;
    margin: 16px 0 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #d97706;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: 800;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 8px;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.helpers {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    font-size: 14px;
    flex-wrap: wrap;
}

.helpers a {
    color: #d97706;
    font-weight: 700;
    text-decoration: none;
}

.helpers a:hover {
    text-decoration: underline;
}

.reset-panel {
    display: none;
    margin-top: 18px;
    padding: 16px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 12px;
}

.reset-panel h3 {
    margin-bottom: 8px;
    font-size: 18px;
}

.reset-panel input {
    margin-bottom: 12px;
}

.reset-actions {
    display: flex;
    gap: 10px;
}

.reset-actions button {
    margin-top: 0;
    width: auto;
    flex: 1;
}

.reset-actions .secondary {
    background: #e5e7eb;
    color: #1f2937;
}

.signup {
    text-align: center;
    margin-top: 20px;
}
 
.signup a {
    color: #d97706;
    font-weight: 700;
}

</style>

</head>

<body>

<div class="header">

<a href="index.html">
Mobility<span>.</span>
</a>

</div>

<div class="container">

<div class="card">

<h1>Welcome Back</h1>

<p class="intro">
Sign in to manage your motorcycle application and payments.
</p>

<form id="loginForm">

<label>Email Address</label>

<input
    id="email"
    type="email"
    required
>

<label>Password</label>

<input
    id="password"
    type="password"
    required
>

<button id="loginButton">
Sign In
</button>

</form>

<div id="message" class="message"></div>

<div class="helpers">
    <a href="#" id="forgotPasswordLink">Forgot password?</a>
</div>

<div id="resetPanel" class="reset-panel">
    <h3>Reset your password</h3>
    <p id="resetHint">Enter the email address you used to register.</p>
    <input id="resetEmail" type="email" placeholder="you@example.com">
    <div class="reset-actions">
        <button id="resetSubmit" type="button">Send reset email</button>
        <button id="resetCancel" type="button" class="secondary">Cancel</button>
    </div>
</div>
 
<div class="signup">
 
Don't have an account?
 
<a href="signup.html">
Create Account
</a>
 
</div>

</div>

</div>

<script>

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");
const forgotPasswordLink = document.getElementById("forgotPasswordLink");
const resetPanel = document.getElementById("resetPanel");
const resetEmail = document.getElementById("resetEmail");
const resetSubmit = document.getElementById("resetSubmit");
const resetCancel = document.getElementById("resetCancel");
const resetHint = document.getElementById("resetHint");

function maskEmail(email) {
    const trimmed = String(email || "").trim();

    if (!trimmed || !trimmed.includes("@")) {
        return "********";
    }

    const [localPart, domain] = trimmed.split("@");
    const visibleLocal = localPart.length <= 2
        ? localPart.slice(0, 1)
        : localPart.slice(0, 2);

    return visibleLocal + "***@" + domain;
}

function normalizeEmail(value) {
    return String(value || "").trim().toLowerCase();
}

function getStoredUsers() {
    const candidates = [
        localStorage.getItem("mhp_users"),
        localStorage.getItem("users"),
        localStorage.getItem("mhp_current_user")
    ];

    const collected = [];

    candidates.forEach(candidate => {
        if (!candidate) {
            return;
        }

        try {
            const parsed = JSON.parse(candidate);
            if (Array.isArray(parsed)) {
                collected.push(...parsed);
                return;
            }

            if (parsed && typeof parsed === "object") {
                collected.push(parsed);
            }
        } catch (error) {
            // Ignore malformed storage entries and keep searching.
        }
    });

    return collected.filter(Boolean);
}

function findRegisteredUserByEmail(candidate) {
    const normalizedCandidate = normalizeEmail(candidate);

    if (!normalizedCandidate) {
        return null;
    }

    const users = getStoredUsers();
    const exactMatch = users.find(user => normalizeEmail(user.email || user.user_metadata?.email || "") === normalizedCandidate);

    if (exactMatch) {
        return exactMatch;
    }

    return users.find(user => {
        const email = normalizeEmail(user.email || user.user_metadata?.email || "");
        return email.includes(normalizedCandidate) || normalizedCandidate.includes(email);
    }) || null;
}

function showMessage(text, type) {
    message.style.display = "block";
    message.className = "message " + type;
    message.textContent = text;
}

function hideResetPanel() {
    resetPanel.style.display = "none";
    resetEmail.value = "";
    resetHint.textContent = "Enter the email address you used to register.";
}

function getLastResetRequestTime() {
   const raw = Number(localStorage.getItem("mhp_last_reset_request") || "0");
   return Number.isFinite(raw) ? raw : 0;
}

function isResetRequestAllowed() {
   const lastRequest = getLastResetRequestTime();
   return !lastRequest || Date.now() - lastRequest >= 50000;
}

function showResetCooldownMessage() {
   const lastRequest = getLastResetRequestTime();
   const elapsed = Date.now() - lastRequest;
   const remaining = Math.max(0, Math.ceil((50000 - elapsed) / 1000));
   showMessage("For security purposes, you can only request a password reset after " + remaining + " seconds. Please wait and try again.", "error");
}

forgotPasswordLink.addEventListener("click", function(event) {
    event.preventDefault();
    resetPanel.style.display = "block";
    resetEmail.focus();

    const emailFromField = document.getElementById("email").value.trim();
    if (emailFromField) {
        resetEmail.value = emailFromField;
    }
});

resetCancel.addEventListener("click", function() {
    hideResetPanel();
});

resetSubmit.addEventListener("click", async function() {
    const typedEmail = resetEmail.value.trim();

    if (!typedEmail) {
        showMessage("Please enter the email address you used to register.", "error");
        return;
    }

   if (!isResetRequestAllowed()) {
       showResetCooldownMessage();
       return;
   }

   const matchingUser = findRegisteredUserByEmail(typedEmail);
   const authAPI = supabaseClient && supabaseClient.auth;

   if (!matchingUser) {
       showMessage("No account matches that email. Please type the full email exactly as it was used during registration.", "error");
       resetHint.textContent = "We could not find a matching account. Please type the exact registered email address.";
       return;
   }

   const exactEmail = String(matchingUser.email || "").trim();
   const maskedEmail = maskEmail(exactEmail);

   if (typedEmail.toLowerCase() !== exactEmail.toLowerCase()) {
       showMessage("That email does not match the registered account. Please type the exact full email used during registration.", "error");
       resetHint.textContent = "We found a matching account for " + maskedEmail + ". Please type the exact full email address to continue.";
       return;
   }

   try {
       if (authAPI && typeof authAPI.resetPasswordForEmail === "function") {
           localStorage.setItem("mhp_last_reset_request", String(Date.now()));
           const liveResetUrl = "https://paul221177.github.io/mobility-hire-purchase/login.html";
           const { error } = await authAPI.resetPasswordForEmail(exactEmail, {
               redirectTo: liveResetUrl
           });

           if (error) {
               throw error;
           }
       } else {
           localStorage.setItem("mhp_last_reset_request", String(Date.now()));
           const requests = JSON.parse(localStorage.getItem("mhp_password_reset_requests") || "[]");
           requests.push({
               email: exactEmail,
               requested_at: new Date().toISOString(),
               token: "demo-reset-" + Date.now()
           });
           localStorage.setItem("mhp_password_reset_requests", JSON.stringify(requests));
       }

       hideResetPanel();
       showMessage("A password reset email has been sent to " + exactEmail + ".", "success");
   } catch (error) {
       console.error(error);
       localStorage.setItem("mhp_last_reset_request", String(Date.now()));
       if (String(error && error.message || "").toLowerCase().includes("for security purposes") || String(error && error.status || "").includes("429")) {
           showResetCooldownMessage();
       } else {
           showMessage(error.message || "Unable to send password reset email.", "error");
       }
   }
});
 
 form.addEventListener("submit", async function(event) {
 
   event.preventDefault();
 
   const email =
       document.getElementById("email").value.trim();
 
   const password =
       document.getElementById("password").value;
 
   button.disabled = true;
   button.textContent = "Signing In...";
 
   try {
 
       if (supabaseClient && typeof supabaseClient.auth?.signInWithPassword === "function") {
           const { data, error } =
               await supabaseClient.auth.signInWithPassword({
                   email,
                   password
               });

           if (!error && data?.user) {
               const user = data.user;
               const metadata = user.user_metadata || {};
               const profile = {
                   id: user.id,
                   first_name: metadata.first_name || "",
                   last_name: metadata.last_name || "",
                   email: user.email,
                   phone: metadata.phone || "",
                   address: metadata.address || "",
                   business_name: metadata.business_name || "Mobility & Hire-Purchase Services",
                   account_type: metadata.account_type || "Hire-Purchase"
               };

               const { error: profileError } =
                   await supabaseClient
                       .from("profiles")
                       .upsert(profile);

               if (profileError) {
                   throw profileError;
               }

               showMessage(
                   "Login successful. Opening your dashboard...",
                   "success"
               );

               setTimeout(() => {
                   window.location.href = "dashboard.html";
               }, 800);
               return;
           }

           if (error && !/invalid login credentials|invalid credentials|no user/i.test(String(error.message || error))) {
               throw error;
           }
       }

       const fallbackUsers = getStoredUsers();
       const matchingUser = fallbackUsers.find(user => {
           const emailValue = normalizeEmail(user.email || user.user_metadata?.email || "");
           return emailValue === normalizeEmail(email) && String(user.password || "") === String(password || "");
       });

       if (!matchingUser) {
           throw new Error("No account matches that email. Please type the full email exactly as it was used during registration.");
       }

       localStorage.setItem("mhp_session", JSON.stringify({ user_id: matchingUser.id || matchingUser.user_id || matchingUser.email }));
       localStorage.setItem("mhp_current_user", JSON.stringify(matchingUser));
       showMessage("Login successful. Opening your dashboard...", "success");
       setTimeout(() => {
           window.location.href = "dashboard.html";
       }, 800);

   } catch (error) {
 
       console.error(error);
 
       showMessage(
           error.message || "Login failed.",
           "error"
       );
 
       button.disabled = false;
       button.textContent = "Sign In";
   }
 
});

</script>

</body>
</html>
