<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | Mobility Hire Purchase</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #172033;
}

.header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 20px 25px;
}

.header a {
    text-decoration: none;
    color: #111827;
    font-size: 21px;
    font-weight: 800;
}

.header span {
    color: #d97706;
}

.container {
    max-width: 500px;
    margin: 70px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 18px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 30px rgba(0,0,0,.05);
}

h1 {
    margin-bottom: 10px;
}

.intro {
    color: #667085;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: 700;
    margin: 16px 0 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #d97706;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: 800;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 8px;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.signup {
    text-align: center;
    margin-top: 20px;
}

.signup a {
    color: #d97706;
    font-weight: 700;
}

</style>

</head>

<body>

<div class="header">

<a href="index.html">
Mobility<span>.</span>
</a>

</div>

<div class="container">

<div class="card">

<h1>Welcome Back</h1>

<p class="intro">
Sign in to manage your motorcycle application and payments.
</p>

<form id="loginForm">

<label>Email Address</label>

<input
    id="email"
    type="email"
    required
>

<label>Password</label>

<input
    id="password"
    type="password"
    required
>

<button id="loginButton">
Sign In
</button>

</form>

<div id="message" class="message"></div>

<div class="signup">

Don't have an account?

<a href="signup.html">
Create Account
</a>

</div>

</div>

</div>

<script>

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {

    message.style.display = "block";
    message.className = "message " + type;
    message.textContent = text;

}

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Signing In...";

    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email,
                password

            });

        if (error) {
            throw error;
        }

        const user = data.user;

        /*
         * Create/update the customer's profile
         * using the information saved during signup.
         */

        const metadata = user.user_metadata || {};

        const profile = {

            id: user.id,

            first_name:
                metadata.first_name || "",

            last_name:
                metadata.last_name || "",

            email:
                user.email,

            phone:
                metadata.phone || "",

            address:
                metadata.address || "",

            business_name:
                metadata.business_name ||
                "Mobility & Hire-Purchase Services",

            account_type:
                metadata.account_type ||
                "Hire-Purchase"

        };

        const { error: profileError } =
            await supabaseClient
                .from("profiles")
                .upsert(profile);

        if (profileError) {
            throw profileError;
        }

        showMessage(
            "Login successful. Opening your dashboard...",
            "success"
        );

        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        }, 800);

    } catch (error) {

        console.error(error);

        showMessage(
            error.message || "Login failed.",
            "error"
        );

        button.disabled = false;
        button.textContent = "Sign In";
    }

});

</script>

</body>
</html>
