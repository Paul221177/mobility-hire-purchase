```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | Mobility</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#172033;
    min-height:100vh;
}

.header{
    background:white;
    border-bottom:1px solid #e5e7eb;
    padding:18px 25px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:800;
    text-decoration:none;
    color:#111827;
}

.logo span{
    color:#d97706;
}

.back{
    color:#64748b;
    text-decoration:none;
}

.container{
    max-width:500px;
    margin:70px auto;
    padding:0 20px;
}

.card{
    background:white;
    padding:35px;
    border-radius:18px;
    border:1px solid #e5e7eb;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    color:#64748b;
    margin-bottom:30px;
}

label{
    display:block;
    font-weight:700;
    font-size:14px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:20px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#d97706;
    color:white;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

button:hover{
    background:#b85f00;
}

.message{
    display:none;
    padding:12px;
    background:#fee2e2;
    color:#991b1b;
    border-radius:8px;
    margin-bottom:18px;
    font-size:14px;
}

.signup{
    text-align:center;
    margin-top:20px;
    color:#64748b;
    font-size:14px;
}

.signup a{
    color:#d97706;
    font-weight:700;
    text-decoration:none;
}

</style>
</head>

<body>

<header class="header">

<div class="header-inner">

<a href="index.html" class="logo">
Mobility<span>.</span>
</a>

<a href="index.html" class="back">
← Back
</a>

</div>

</header>

<div class="container">

<div class="card">

<h1>Welcome Back</h1>

<p class="subtitle">
Sign in to manage your Mobility account.
</p>

<div id="message" class="message"></div>

<form id="loginForm">

<label>Email Address</label>

<input
type="email"
id="email"
required
>

<label>Password</label>

<input
type="password"
id="password"
required
>

<button type="submit">
Sign In
</button>

</form>

<div class="signup">

Don't have an account?
<a href="signup.html">Create Account</a>

</div>

</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim().toLowerCase();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    const users =
        JSON.parse(localStorage.getItem("mhp_users") || "[]");

    const user = users.find(
        u => u.email === email && u.password === password
    );

    if(!user){

        message.textContent =
            "Incorrect email or password.";

        message.style.display = "block";

        return;

    }

    localStorage.setItem(
        "mhp_current_user",
        JSON.stringify(user)
    );

    window.location.href = "dashboard.html";

});

</script>

</body>
</html>
