<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users | Mobility Hire Purchase</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #172033;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .title { font-size: 32px; font-weight: 800; }
        .card {
            background: white; border: 1px solid #e5e7eb; border-radius: 14px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(15,23,42,0.05);
        }
        table {
            width: 100%; border-collapse: collapse;
        }
        th, td {
            text-align: left; padding: 14px 16px; border-bottom: 1px solid #edf2f7;
        }
        th {
            background: #fff7ed; color: #9a4d00; font-size: 12px; letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .message {
            display: none; padding: 18px; background: #fff7ed; border: 1px solid #fed7aa;
            border-radius: 12px; color: #9a4d00; margin-bottom: 20px;
        }
        .badge {
            display: inline-block; padding: 6px 10px; border-radius: 999px;
            background: #fef3c7; color: #92400e; font-weight: 700; font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Registered Users</div>
            <a href="index.html" style="text-decoration:none; color:#d97706; font-weight:700;">Back home</a>
        </div>

        <div id="message" class="message"></div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Business</th>
                        <th>Account Type</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="userRows"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const message = document.getElementById("message");
        const rows = document.getElementById("userRows");

        function showMessage(text) {
            message.style.display = "block";
            message.textContent = text;
        }

        function formatDate(value) {
            if (!value) return "-";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleString();
        }

        async function loadUsers() {
            if (!window.supabaseClient || window.supabaseClient.__mode !== "real") {
                showMessage("Supabase is not configured yet. Add your project URL and anon key in supabase-config.js to view live registrations.");
                rows.innerHTML = "<tr><td colspan='6' style='padding:20px; color:#667085;'>No live users available.</td></tr>";
                return;
            }

            const { data, error } = await window.supabaseClient
                .from("profiles")
                .select("*")
                .order("created_at", { ascending: false });

            if (error) {
                console.error(error);
                showMessage(error.message || "Unable to load registered users.");
                return;
            }

            if (!data || data.length === 0) {
                rows.innerHTML = "<tr><td colspan='6' style='padding:20px; color:#667085;'>No users registered yet.</td></tr>";
                return;
            }

            rows.innerHTML = data.map(user => `
                <tr>
                    <td>${(user.first_name || "") + " " + (user.last_name || "")}</td>
                    <td>${user.email || "-"}</td>
                    <td>${user.phone || "-"}</td>
                    <td>${user.business_name || "-"}</td>
                    <td><span class="badge">${user.account_type || "Hire-Purchase"}</span></td>
                    <td>${formatDate(user.created_at)}</td>
                </tr>
            `).join("");
        }

        loadUsers();
    </script>
</body>
</html>
