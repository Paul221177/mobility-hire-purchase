<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motorcycle Application | Mobility Hire Purchase</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #172033;
}

.header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
}

.header a {
    text-decoration: none;
    color: #111827;
    font-weight: 800;
    font-size: 21px;
}

.header span {
    color: #d97706;
}

.container {
    max-width: 650px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 18px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 30px rgba(0,0,0,.05);
}

h1 {
    margin-bottom: 10px;
}

.intro {
    color: #667085;
    margin-bottom: 30px;
}

.customer {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.customer strong {
    display: block;
    margin-bottom: 5px;
}

label {
    display: block;
    font-weight: 700;
    margin: 18px 0 7px;
}

select,
input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: white;
    font-size: 15px;
}

.summary {
    margin-top: 25px;
    background: #f8fafc;
    padding: 20px;
    border-radius: 10px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #d97706;
    color: white;
    font-weight: 800;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.message {
    display: none;
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

</style>

</head>

<body>

<div class="header">

<a href="index.html">
Mobility<span>.</span>
</a>

<a href="dashboard.html">
Dashboard
</a>

</div>

<div class="container">

<div class="card">

<h1>Motorcycle Application</h1>

<p class="intro">
Choose a motorcycle and repayment option to submit your
hire-purchase application.
</p>

<div class="customer">

<strong id="customerName">
Loading customer...
</strong>

<span id="customerEmail">
</span>

</div>

<form id="applicationForm">

<label>Motorcycle</label>

<select id="motorcycle" required>

<option value="">
Select Motorcycle
</option>

</select>

<label>Repayment Frequency</label>

<select id="frequency">

<option value="Weekly">
Weekly
</option>

<option value="Monthly">
Monthly
</option>

</select>

<div class="summary">

<div class="summary-row">

<span>Motorcycle Price</span>

<strong id="price">
₦0
</strong>

</div>

<div class="summary-row">

<span>Weekly Payment</span>

<strong id="weekly">
₦0
</strong>

</div>

</div>

<button id="submitButton">

Submit Hire-Purchase Application

</button>

</form>

<div id="message" class="message"></div>

</div>

</div>

<script>

let currentUser = null;
let motorcycles = [];

const motorcycleSelect =
    document.getElementById("motorcycle");

const priceElement =
    document.getElementById("price");

const weeklyElement =
    document.getElementById("weekly");

const form =
    document.getElementById("applicationForm");

const button =
    document.getElementById("submitButton");

const message =
    document.getElementById("message");

function money(value) {

    return new Intl.NumberFormat(
        "en-NG",
        {
            style: "currency",
            currency: "NGN",
            maximumFractionDigits: 0
        }
    ).format(value);

}

function showMessage(text, type) {

    message.style.display = "block";
    message.className = "message " + type;
    message.textContent = text;

}

async function loadPage() {

    const { data, error } =
        await supabaseClient.auth.getUser();

    if (error || !data.user) {

        window.location.href = "login.html";

        return;
    }

    currentUser = data.user;

    const metadata =
        currentUser.user_metadata || {};

    document.getElementById("customerName").textContent =
        `${metadata.first_name || ""} ${metadata.last_name || ""}`.trim();

    document.getElementById("customerEmail").textContent =
        currentUser.email;

    await loadMotorcycles();

}

async function loadMotorcycles() {

    const { data, error } =
        await supabaseClient
            .from("motorcycles")
            .select("*")
            .eq("available", true)
            .order("price", { ascending: true });

    if (error) {

        console.error(error);

        showMessage(
            "Unable to load motorcycles.",
            "error"
        );

        return;
    }

    motorcycles = data || [];

    motorcycleSelect.innerHTML =
        '<option value="">Select Motorcycle</option>';

    motorcycles.forEach(bike => {

        const option =
            document.createElement("option");

        option.value = bike.id;

        option.textContent =
            `${bike.name} — ${money(bike.price)}`;

        motorcycleSelect.appendChild(option);

    });

}

motorcycleSelect.addEventListener("change", function() {

    const bike =
        motorcycles.find(
            item => String(item.id) === this.value
        );

    if (!bike) {

        priceElement.textContent = "₦0";
        weeklyElement.textContent = "₦0";

        return;
    }

    priceElement.textContent =
        money(bike.price);

    weeklyElement.textContent =
        money(30000);

});

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!currentUser) {
        return;
    }

    const motorcycleId =
        motorcycleSelect.value;

    if (!motorcycleId) {

        showMessage(
            "Please select a motorcycle.",
            "error"
        );

        return;
    }

    const bike =
        motorcycles.find(
            item => String(item.id) === motorcycleId
        );

    if (!bike) {
        return;
    }

    button.disabled = true;
    button.textContent = "Submitting Application...";

    try {

        /*
         * Prevent duplicate active applications.
         */

        const { data: existing } =
            await supabaseClient
                .from("applications")
                .select("id")
                .eq("user_id", currentUser.id)
                .in(
                    "status",
                    ["Under Review", "Approved", "Active"]
                );

        if (existing && existing.length > 0) {

            showMessage(
                "You already have an active hire-purchase application.",
                "error"
            );

            button.disabled = false;
            button.textContent =
                "Submit Hire-Purchase Application";

            return;
        }

        const year =
            new Date().getFullYear();

        const randomNumber =
            Math.floor(
                1000 + Math.random() * 9000
            );

        const applicationId =
            `MHP-${year}-${randomNumber}`;

        const weeklyPayment = 30000;

        const { error } =
            await supabaseClient
                .from("applications")
                .insert({

                    application_id:
                        applicationId,

                    user_id:
                        currentUser.id,

                    motorcycle_id:
                        bike.id,

                    motorcycle_name:
                        bike.name,

                    motorcycle_price:
                        bike.price,

                    repayment_frequency:
                        document.getElementById(
                            "frequency"
                        ).value,

                    weekly_payment:
                        weeklyPayment,

                    amount_paid:
                        0,

                    balance:
                        bike.price,

                    status:
                        "Under Review"

                });

        if (error) {
            throw error;
        }

        showMessage(
            `Application submitted successfully. Your application ID is ${applicationId}.`,
            "success"
        );

        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        }, 1800);

    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to submit application.",
            "error"
        );

        button.disabled = false;

        button.textContent =
            "Submit Hire-Purchase Application";

    }

});

loadPage();

</script>

</body>
</html>
