```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motorcycle Application | Mobility</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#172033;
}

.header{
    background:white;
    border-bottom:1px solid #e5e7eb;
    padding:18px 25px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:800;
    color:#111827;
    text-decoration:none;
}

.logo span{
    color:#d97706;
}

.container{
    max-width:750px;
    margin:45px auto;
    padding:0 20px;
}

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    color:#64748b;
    margin-bottom:30px;
}

.user-box{
    background:#fffaf2;
    border:1px solid #fde3b0;
    padding:18px;
    border-radius:10px;
    margin-bottom:25px;
}

.user-box strong{
    display:block;
    margin-bottom:4px;
}

.user-box span{
    color:#64748b;
    font-size:14px;
}

label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
}

select,input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:20px;
    font-size:15px;
}

.motorcycle-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
}

.motorcycle-card h3{
    margin-bottom:8px;
}

.motorcycle-card p{
    color:#64748b;
    font-size:14px;
}

.price{
    font-size:22px;
    font-weight:800;
    color:#d97706;
    margin-top:10px;
}

button{
    width:100%;
    padding:15px;
    background:#d97706;
    color:white;
    border:0;
    border-radius:8px;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#b85f00;
}

</style>

</head>

<body>

<header class="header">

<div class="header-inner">

<a href="index.html" class="logo">
Mobility<span>.</span>
</a>

<a href="dashboard.html">
Dashboard
</a>

</div>

</header>

<div class="container">

<div class="card">

<h1>Motorcycle Application</h1>

<p class="subtitle">
Apply for a motorcycle through our structured hire-purchase program.
</p>

<div class="user-box">

<strong id="customerName">
Customer
</strong>

<span id="customerEmail">
customer@email.com
</span>

</div>

<form id="applicationForm">

<label>Select Motorcycle</label>

<select id="motorcycle" required>

<option value="">
Select motorcycle
</option>

<option
value="TVS Rockz 125"
data-price="1500000">
TVS Rockz 125 — ₦1,500,000
</option>

<option
value="Honda ACE 125"
data-price="1550000">
Honda ACE 125 — ₦1,550,000
</option>

<option
value="Bajaj Boxer"
data-price="1600000">
Bajaj Boxer — ₦1,600,000
</option>

</select>

<div id="motorcycleDetails" class="motorcycle-card" style="display:none">

<h3 id="bikeName"></h3>

<p>
Commercial motorcycle suitable for income-generating activities.
</p>

<div class="price" id="bikePrice"></div>

</div>

<label>Repayment Frequency</label>

<select id="frequency" required>

<option value="weekly">
Weekly
</option>

<option value="monthly">
Monthly
</option>

</select>

<label>Preferred Payment Amount</label>

<input
type="number"
id="payment"
placeholder="Example: 30000"
min="1"
required
>

<button type="submit">
Submit Hire-Purchase Application
</button>

</form>

</div>

</div>

<script>

const currentUser =
    JSON.parse(localStorage.getItem("mhp_current_user"));

if(!currentUser){

    window.location.href = "login.html";

}

document.getElementById("customerName").textContent =
    currentUser.fullName;

document.getElementById("customerEmail").textContent =
    currentUser.email;


const motorcycle =
    document.getElementById("motorcycle");

motorcycle.addEventListener("change",function(){

    const option =
        motorcycle.options[motorcycle.selectedIndex];

    const price =
        option.getAttribute("data-price");

    if(!price){

        document.getElementById("motorcycleDetails")
            .style.display = "none";

        return;

    }

    document.getElementById("motorcycleDetails")
        .style.display = "block";

    document.getElementById("bikeName")
        .textContent = option.value;

    document.getElementById("bikePrice")
        .textContent =
        "₦" + Number(price).toLocaleString();

});


document.getElementById("applicationForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const option =
        motorcycle.options[motorcycle.selectedIndex];

    const bikeName =
        option.value;

    const price =
        Number(option.getAttribute("data-price"));

    const frequency =
        document.getElementById("frequency").value;

    const payment =
        Number(document.getElementById("payment").value);

    if(!bikeName || !price || !payment){

        alert("Please complete all required fields.");

        return;

    }

    const applications =
        JSON.parse(
            localStorage.getItem("mhp_applications") || "[]"
        );

    const application = {

        id:
            "MHP-" +
            new Date().getFullYear() +
            "-" +
            String(applications.length + 1).padStart(4,"0"),

        userId:
            currentUser.id,

        applicant:
            currentUser.fullName,

        email:
            currentUser.email,

        phone:
            currentUser.phone,

        motorcycle:
            bikeName,

        motorcyclePrice:
            price,

        repaymentFrequency:
            frequency,

        weeklyPayment:
            frequency === "weekly" ? payment : 0,

        monthlyPayment:
            frequency === "monthly" ? payment : 0,

        amountPaid:
            0,

        balance:
            price,

        progress:
            0,

        status:
            "UNDER REVIEW",

        submittedAt:
            new Date().toISOString(),

        payments: []

    };

    applications.push(application);

    localStorage.setItem(
        "mhp_applications",
        JSON.stringify(applications)
    );

    localStorage.setItem(
        "mhp_current_application",
        JSON.stringify(application)
    );

    window.location.href = "dashboard.html";

});

</script>

</body>
</html>
```
