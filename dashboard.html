<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Dashboard | Mobility Hire Purchase</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #172033;
}

nav {
    background: white;
    border-bottom: 1px solid #e5e7eb;
}

.nav {
    max-width: 1150px;
    margin: auto;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: 800;
}

.logo span {
    color: #d97706;
}

.nav-right {
    display: flex;
    gap: 15px;
    align-items: center;
}

.nav-right button {
    border: none;
    background: transparent;
    color: #d97706;
    font-weight: 700;
    cursor: pointer;
}

.container {
    max-width: 1150px;
    margin: auto;
    padding: 50px 25px;
}

.welcome {
    margin-bottom: 30px;
}

.welcome h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

.welcome p {
    color: #667085;
}

.cards {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 30px;
}

.card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 22px;
}

.card-label {
    font-size: 12px;
    color: #667085;
    font-weight: 700;
    margin-bottom: 8px;
}

.card-value {
    font-size: 23px;
    font-weight: 800;
    color: #111827;
}

.status {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 10px;
    border-radius: 20px;
    background: #fff7ed;
    color: #c2410c;
    font-size: 12px;
    font-weight: 800;
}

.main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.section {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 28px;
}

.section h2 {
    margin-bottom: 20px;
}

.detail {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #edf0f4;
}

.detail:last-child {
    border-bottom: none;
}

.detail span {
    color: #667085;
}

.detail strong {
    text-align: right;
}

.progress {
    width: 100%;
    height: 12px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
    margin: 20px 0 10px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #d97706;
}

.progress-text {
    font-weight: 800;
    color: #d97706;
}

.empty {
    text-align: center;
    padding: 40px 20px;
}

.empty p {
    color: #667085;
    margin: 10px 0 20px;
}

.primary {
    display: inline-block;
    background: #d97706;
    color: white;
    padding: 13px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 800;
}

.actions {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.action {
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    color: #374151;
    font-weight: 700;
}

.loading {
    text-align: center;
    padding: 100px 20px;
}

@media(max-width:850px) {

    .cards {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .main-grid {
        grid-template-columns: 1fr;
    }

}

@media(max-width:550px) {

    .cards {
        grid-template-columns: 1fr;
    }

    .welcome h1 {
        font-size: 30px;
    }

}

</style>

</head>

<body>

<nav>

<div class="nav">

<div class="logo">
Mobility<span>.</span>
</div>

<div class="nav-right">

<span id="navName">
Customer
</span>

<button onclick="signOut()">
Sign Out
</button>

</div>

</div>

</nav>

<div id="loading" class="loading">

Loading your dashboard...

</div>

<div id="dashboard" style="display:none;">

<div class="container">

<div class="welcome">

<h1>
Welcome back,
<span id="customerName">
Customer
</span>
</h1>

<p>
Manage your motorcycle application, payments and
hire-purchase progress from one place.
</p>

</div>

<div id="applicationArea">

</div>

</div>

</div>

<script>

let currentUser = null;

function money(value) {

    return new Intl.NumberFormat(
        "en-NG",
        {
            style: "currency",
            currency: "NGN",
            maximumFractionDigits: 0
        }
    ).format(value || 0);

}

async function loadDashboard() {

    const { data, error } =
        await supabaseClient.auth.getUser();

    if (error || !data.user) {

        window.location.href =
            "login.html";

        return;
    }

    currentUser = data.user;

    /*
     * Get customer's profile.
     */

    const { data: profile } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", currentUser.id)
            .maybeSingle();

    let firstName = "";

    if (profile) {

        firstName =
            profile.first_name || "";

    } else {

        firstName =
            currentUser.user_metadata?.first_name || "";

    }

    document.getElementById(
        "customerName"
    ).textContent =
        firstName || "Customer";

    document.getElementById(
        "navName"
    ).textContent =
        firstName || "Customer";

    /*
     * Get customer's latest application.
     */

    const { data: applications, error: appError } =
        await supabaseClient
            .from("applications")
            .select("*")
            .eq("user_id", currentUser.id)
            .order("created_at", {
                ascending: false
            })
            .limit(1);

    if (appError) {

        console.error(appError);

        document.getElementById(
            "applicationArea"
        ).innerHTML = `

            <div class="section">

                <h2>
                    Unable to load application
                </h2>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>

        `;

    } else if (
        !applications ||
        applications.length === 0
    ) {

        showNoApplication();

    } else {

        showApplication(
            applications[0]
        );

    }

    document.getElementById(
        "loading"
    ).style.display = "none";

    document.getElementById(
        "dashboard"
    ).style.display = "block";

}

function showNoApplication() {

    document.getElementById(
        "applicationArea"
    ).innerHTML = `

        <div class="section empty">

            <h2>
                No Hire-Purchase Application Yet
            </h2>

            <p>
                You have not submitted a motorcycle
                hire-purchase application.
            </p>

            <a
                class="primary"
                href="application.html"
            >
                Apply for a Motorcycle
            </a>

        </div>

    `;

}

function showApplication(app) {

    const price =
        Number(app.motorcycle_price || 0);

    const paid =
        Number(app.amount_paid || 0);

    const balance =
        Number(app.balance || 0);

    let progress = 0;

    if (price > 0) {

        progress =
            Math.round(
                (paid / price) * 100
            );

    }

    if (progress > 100) {
        progress = 100;
    }

    document.getElementById(
        "applicationArea"
    ).innerHTML = `

        <div class="cards">

            <div class="card">

                <div class="card-label">
                    APPLICATION STATUS
                </div>

                <div class="card-value"
                     style="font-size:18px;">
                    ${app.status}
                </div>

                <span class="status">
                    ${app.status}
                </span>

            </div>

            <div class="card">

                <div class="card-label">
                    MOTORCYCLE PRICE
                </div>

                <div class="card-value">
                    ${money(price)}
                </div>

            </div>

            <div class="card">

                <div class="card-label">
                    WEEKLY PAYMENT
                </div>

                <div class="card-value">
                    ${money(app.weekly_payment)}
                </div>

            </div>

            <div class="card">

                <div class="card-label">
                    BALANCE
                </div>

                <div class="card-value">
                    ${money(balance)}
                </div>

            </div>

        </div>


        <div class="main-grid">

            <div class="section">

                <h2>
                    Hire-Purchase Application
                </h2>

                <div class="detail">

                    <span>
                        Application ID
                    </span>

                    <strong>
                        ${app.application_id}
                    </strong>

                </div>

                <div class="detail">

                    <span>
                        Motorcycle
                    </span>

                    <strong>
                        ${app.motorcycle_name}
                    </strong>

                </div>

                <div class="detail">

                    <span>
                        Purchase Price
                    </span>

                    <strong>
                        ${money(price)}
                    </strong>

                </div>

                <div class="detail">

                    <span>
                        Repayment
                    </span>

                    <strong>
                        ${app.repayment_frequency}
                    </strong>

                </div>

                <div class="detail">

                    <span>
                        Amount Paid
                    </span>

                    <strong>
                        ${money(paid)}
                    </strong>

                </div>

                <div class="detail">

                    <span>
                        Outstanding Balance
                    </span>

                    <strong>
                        ${money(balance)}
                    </strong>

                </div>

            </div>


            <div class="section">

                <h2>
                    Hire-Purchase Progress
                </h2>

                <p>
                    ${progress}% of the motorcycle
                    purchase price has been paid.
                </p>

                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width:${progress}%"
                    ></div>

                </div>

                <div class="progress-text">
                    ${progress}%
                </div>

                <div class="actions">

                    <a
                        class="action"
                        href="application.html"
                    >
                        New Application
                    </a>

                    <a
                        class="action"
                        href="bikes.html"
                    >
                        Browse Motorcycles
                    </a>

                </div>

            </div>

        </div>

    `;

}

async function signOut() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";

}

loadDashboard();

</script>

</body>
</html>
